<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#010102" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <!-- Decide the theme BEFORE first paint → no flash. Saved choice wins,
         otherwise follow the OS, defaulting to dark (Linear near-black canvas). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ia-theme");
          var sysLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = saved || (sysLight ? "light" : "dark");
          var root = document.documentElement;
          root.classList.remove("dark", "light");
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236E79E5' d='M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5l8-3z'/%3E%3Cpath fill='%23010102' d='M10.2 14.3l-2-2-1.3 1.3 3.3 3.3 6-6-1.3-1.4z'/%3E%3C/svg%3E"
    />
    <title>Intent-Aware — Autonomous QA + Security</title>
    <meta
      name="description"
      content="Point it at a live app. It explores like QA, attacks like a pentester, and hands back a founder-grade report."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
